<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perkiraan Cuaca & Bencana</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <style>
      body {
        background: linear-gradient(to bottom, #c0e2fa, #f8d9d7);
        background-attachment: fixed;
        font-family: "Poppins", sans-serif;
      }
    </style>
  </head>
  <body class="text-gray-900">
    <!-- Navbar -->
    <nav class="bg-gradient-to-r from-[#7BD3EA] to-[#074799] p-4 text-white shadow-lg">
      <h1 class="text-2xl font-bold text-center">Perkiraan Cuaca</h1>
    </nav>

    <!-- Search Bar -->
    <div class="container mx-auto p-6 flex flex-col items-center">
      <div class="w-full max-w-lg flex gap-2">
        <input id="searchBar" type="text" placeholder="Cari wilayah..." class="flex-1 p-3 border rounded-lg shadow focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <button id="searchButton" class="p-3 bg-blue-600 text-white rounded-lg shadow hover:bg-blue-700 transition">Cari</button>
      </div>
    </div>

    <!-- Peta Interaktif -->
    <div id="map" class="w-full h-[50vh] mt-4 mx-auto max-w-4xl rounded-lg shadow-lg"></div>

    <!-- Konten Cuaca -->
    <div class="container mx-auto p-6 flex flex-col justify-center">
      <h2 class="text-2xl font-semibold text-center mb-4">Data Cuaca</h2>
      <div id="data-container" class="mt-4 p-6 bg-white rounded-lg shadow-lg text-center text-gray-700">
        <p>Silakan cari wilayah untuk melihat cuaca.</p>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
      const API_KEY = "558b5fc6cc0d1cd28ec87a029572d475"; // API Key OpenWeather

      // Inisialisasi Peta
      var map = L.map("map").setView([-2.5489, 118.0149], 5);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap contributors",
      }).addTo(map);

      document.getElementById("searchButton").addEventListener("click", function () {
        var location = document.getElementById("searchBar").value;
        if (!location) {
          alert("Masukkan nama wilayah terlebih dahulu!");
          return;
        }
        document.getElementById("data-container").innerHTML = "<p>Memuat data cuaca...</p>";
        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${location}`)
          .then((response) => response.json())
          .then((data) => {
            if (data.length > 0) {
              let lat = data[0].lat;
              let lon = data[0].lon;
              map.setView([lat, lon], 10);
              L.marker([lat, lon]).addTo(map).bindPopup(location).openPopup();
              fetchWeatherData(lat, lon);
            } else {
              alert("Wilayah tidak ditemukan!");
            }
          })
          .catch((error) => console.error("Error fetching location:", error));
      });

      function fetchWeatherData(lat, lon) {
        fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=id`)
          .then((response) => response.json())
          .then((data) => {
            let icon = `http://openweathermap.org/img/wn/${data.weather[0].icon}.png`;
            document.getElementById("data-container").innerHTML = `
                        <div class='flex flex-col items-center'>
                            <h3 class="text-lg font-bold">Cuaca Hari Ini</h3>
                            <img src="${icon}" alt="Ikon Cuaca" class="w-20">
                            <p class="text-lg font-semibold">${data.main.temp}°C</p>
                            <p>Kelembaban: ${data.main.humidity}%</p>
                            <p>Kecepatan Angin: ${data.wind.speed} m/s</p>
                            <p class="italic">${data.weather[0].description}</p>
                        </div>
                    `;
          })
          .catch((error) => {
            document.getElementById("data-container").innerHTML = "<p>Gagal mengambil data cuaca.</p>";
            console.error("Error fetching weather data:", error);
          });
      }
    </script>
  </body>
</html>
